[tox]
envlist = lint, type, py312
isolated_build = true
skip_missing_interpreters = true

[testenv]
package = wheel
wheel_build_env = .pkg
extras = dev
passenv = OPENAI_API_KEY, TAVILY_API_KEY, LANGSMITH_*
# Tests that reach external services are excluded: CI must stay offline and free.
commands = pytest -m "not live" {posargs}

[testenv:lint]
skip_install = true
deps =
    ruff>=0.8
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:type]
extras = dev
commands = mypy

[testenv:format]
skip_install = true
deps =
    ruff>=0.8
commands =
    ruff check --fix src tests
    ruff format src tests
