name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run mypy

      - name: English-only sources
        run: |
          uv run python scripts/check_ascii.py $(git ls-files '*.py' '*.md' '*.yaml' '*.yml' '*.toml')

      # Typst renders the PDF; without it the rendering tests skip themselves.
      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Tests
        run: uv run pytest -m "not live"
