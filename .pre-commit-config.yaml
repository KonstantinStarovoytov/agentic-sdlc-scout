repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: [pydantic>=2.9, types-pyyaml]

  - repo: local
    hooks:
      # The project is English-only: sources, comments, commits and docs. A
      # regex hook is the cheapest way to keep it that way.
      - id: no-cyrillic
        name: no Cyrillic in tracked files
        entry: python scripts/check_ascii.py
        language: system
        pass_filenames: true
        types_or: [python, markdown, yaml, toml, text]
